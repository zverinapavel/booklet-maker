<style>
  :root {
    --bg:#f5f3ee; --surface:#fff; --surface2:#f0ede6; --text:#1a1814;
    --text-muted:#6b6760; --text-hint:#a09d97; --accent:#2d5a3d;
    --accent-light:#e8f0eb; --accent-mid:#4a8a5f; --border:#dedad3;
    --border-strong:#c4bfb6; --danger:#c0392b; --danger-bg:#fdf0ee;
    --success:#2d6a3f; --success-bg:#eaf4ec;
    --radius:10px; --radius-lg:16px;
    --font:'Georgia','Times New Roman',serif;
    --font-ui:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-ui);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;}

  /* HEADER */
  header{background:var(--accent);color:#fff;padding:0;}
  .header-inner{max-width:860px;margin:0 auto;padding:2.5rem 2rem 2rem;display:flex;align-items:flex-end;gap:2rem;}
  .header-icon{width:64px;height:64px;background:rgba(255,255,255,.15);border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .header-icon svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:1.5;}
  h1{font-family:var(--font);font-size:2rem;font-weight:normal;letter-spacing:-.01em;line-height:1.2;color:#fff;}
  .header-sub{font-size:.95rem;color:rgba(255,255,255,.75);margin-top:4px;}
  .header-wave{height:32px;background:var(--accent);clip-path:ellipse(55% 100% at 50% 0%);margin-top:-1px;}

  /* LANG SWITCHER */
  .lang-switcher{display:flex;gap:4px;margin-left:auto;align-self:flex-start;padding-top:.5rem;}
  .lang-btn{padding:5px 12px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:rgba(255,255,255,.7);transition:all .15s;letter-spacing:.02em;}
  .lang-btn.active{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.7);}
  .lang-btn:hover:not(.active){background:rgba(255,255,255,.1);color:#fff;}

  main{max-width:860px;margin:0 auto;padding:2.5rem 2rem 4rem;}

  /* HOW IT WORKS */
  .how-it-works{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:2.5rem;}
  .step-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;}
  .step-num{width:28px;height:28px;background:var(--accent);color:#fff;border-radius:50%;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .step-card h3{font-size:14px;font-weight:600;margin-bottom:4px;color:var(--text);}
  .step-card p{font-size:13px;color:var(--text-muted);line-height:1.5;}

  /* ILLUSTRATION */
  .illustration-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem 1rem .5rem;margin-bottom:2rem;overflow:hidden;}

  /* TOOL CARD */
  .tool-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.04);overflow:hidden;}
  .tool-card-header{background:var(--surface2);border-bottom:1px solid var(--border);padding:1rem 1.5rem;font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:8px;}
  .tool-card-body{padding:2rem 1.5rem;}

  /* DROP ZONE */
  #drop-zone{border:2px dashed var(--border-strong);border-radius:var(--radius);padding:3.5rem 2rem;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;background:var(--surface2);}
  #drop-zone:hover,#drop-zone.drag-over{border-color:var(--accent-mid);background:var(--accent-light);}
  #drop-zone svg{width:48px;height:48px;stroke:var(--text-hint);margin-bottom:14px;}
  #drop-zone h2{font-size:17px;font-weight:600;margin-bottom:6px;}
  #drop-zone p{font-size:14px;color:var(--text-muted);}
  .drop-btn{display:inline-block;margin-top:16px;padding:9px 20px;background:var(--accent);color:#fff;border-radius:var(--radius);font-size:14px;font-weight:500;cursor:pointer;border:none;transition:background .15s;}
  .drop-btn:hover{background:var(--accent-mid);}

  /* FILE INFO */
  #info-panel{display:none;}
  .file-info-bar{background:var(--accent-light);border:1px solid #b8d4be;border-radius:var(--radius);padding:1rem 1.25rem;display:flex;align-items:center;gap:12px;margin-bottom:1.75rem;flex-wrap:wrap;}
  .file-icon{width:40px;height:40px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .file-icon svg{width:20px;height:20px;stroke:#fff;fill:none;}
  .file-meta{flex:1;min-width:0;}
  .file-meta strong{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .file-meta span{font-size:12px;color:var(--text-muted);}
  .change-link{font-size:13px;color:var(--accent-mid);cursor:pointer;white-space:nowrap;text-decoration:underline;}

  /* STATS */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.75rem;}
  .stat{background:var(--surface2);border-radius:var(--radius);padding:.85rem 1rem;}
  .stat-label{font-size:11px;color:var(--text-hint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
  .stat-value{font-size:20px;font-weight:600;color:var(--text);line-height:1.2;}
  .stat-sub{font-size:11px;color:var(--text-muted);margin-top:2px;}

  /* SETTINGS */
  .settings-row{display:flex;flex-wrap:wrap;gap:1.25rem;margin-bottom:1.75rem;align-items:center;}
  .setting-group{display:flex;align-items:center;gap:8px;}
  .setting-group label{font-size:13px;color:var(--text-muted);}
  .setting-group select,  .setting-group input[type=checkbox]{accent-color:var(--accent);cursor:pointer;}
  .setting-group select{font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);}

  /* SHEETS PREVIEW */
  .sheets-section{margin-bottom:1.75rem;}
  .sheets-section h3{font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
  .sheets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;max-height:220px;overflow-y:auto;padding-right:4px;}
  .sheet-item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;font-size:12px;}
  .sheet-item-title{font-weight:600;color:var(--text-muted);margin-bottom:5px;}
  .sheet-row{display:flex;justify-content:space-between;color:var(--text-muted);}
  .sheet-row span:first-child{color:var(--text-hint);font-size:11px;}
  .sheet-row strong{color:var(--text);font-weight:500;font-size:12px;}
  .blank-page{color:var(--text-hint)!important;font-style:italic;}

  /* GEN BUTTON */
  #gen-btn{display:flex;align-items:center;gap:10px;padding:13px 28px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s;box-shadow:0 2px 8px rgba(45,90,61,.3);}
  #gen-btn:hover{background:var(--accent-mid);}
  #gen-btn:active{transform:scale(.98);}
  #gen-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  #gen-btn svg{width:20px;height:20px;stroke:#fff;fill:none;}

  /* PROGRESS */
  #progress-panel{display:none;margin-top:1.5rem;}
  .progress-bar-wrap{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:8px;}
  #prog-bar{height:100%;background:var(--accent);width:0%;transition:width .2s;border-radius:3px;}
  #prog-label{font-size:13px;color:var(--text-muted);}

  /* RESULT */
  #result-panel{display:none;margin-top:1.5rem;}
  .result-box{background:var(--success-bg);border:1px solid #a8d5b0;border-radius:var(--radius);padding:1.25rem;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .result-check{width:40px;height:40px;background:var(--success);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .result-check svg{width:20px;height:20px;stroke:#fff;fill:none;}
  .result-info{flex:1;}
  .result-info strong{font-size:14px;display:block;}
  .result-info span{font-size:12px;color:var(--text-muted);}
  #dl-btn{display:flex;align-items:center;gap:8px;padding:10px 18px;background:var(--success);color:#fff;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;}
  #dl-btn:hover{background:#245532;}
  #dl-btn svg{width:16px;height:16px;stroke:#fff;fill:none;}
  .print-tip{margin-top:1rem;padding:.9rem 1rem;background:#fffbf0;border:1px solid #e8d89a;border-radius:var(--radius);font-size:13px;color:#7a6820;line-height:1.6;}
  .print-tip strong{color:#5a4c10;}

  /* ERROR */
  #error-panel{display:none;margin-top:1rem;padding:.9rem 1rem;background:var(--danger-bg);border:1px solid #e8b4ae;border-radius:var(--radius);font-size:13px;color:var(--danger);}

  /* FAQ */
  .faq{margin-top:3rem;}
  .faq h2{font-family:var(--font);font-size:1.4rem;font-weight:normal;color:var(--text);margin-bottom:1.25rem;}
  details{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:8px;overflow:hidden;}
  summary{padding:1rem 1.25rem;font-size:14px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;color:var(--text);}
  summary::-webkit-details-marker{display:none;}
  summary::after{content:'+';font-size:18px;color:var(--text-hint);font-weight:300;}
  details[open] summary::after{content:'−';}
  details[open] summary{border-bottom:1px solid var(--border);}
  .faq-body{padding:1rem 1.25rem;font-size:14px;color:var(--text-muted);line-height:1.7;}
  .faq-body p+p{margin-top:.6rem;}

  /* PRINT GUIDE */
  .print-guide{margin-top:3rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
  .print-guide-header{background:var(--surface2);border-bottom:1px solid var(--border);padding:1rem 1.5rem;font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;}
  .print-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));padding:1.5rem;gap:1rem;}
  .print-step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;}
  .print-step-icon{width:56px;height:56px;background:var(--accent-light);border-radius:12px;display:flex;align-items:center;justify-content:center;}
  .print-step-icon svg{width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:1.5;}
  .print-step strong{font-size:13px;color:var(--text);}
  .print-step p{font-size:12px;color:var(--text-muted);line-height:1.5;}
  .print-step-arrow{display:flex;align-items:center;justify-content:center;color:var(--text-hint);font-size:20px;padding-top:18px;}

  footer{text-align:center;padding:2rem;font-size:12px;color:var(--text-hint);border-top:1px solid var(--border);}

  @media(max-width:600px){
    .print-step-arrow{display:none;}
    h1{font-size:1.5rem;}
    .header-icon{display:none;}
    .lang-switcher{padding-top:0;}
  }
</style>
</head>

let currentLang = 'cs';

function t(key) { return TRANSLATIONS[currentLang][key] || key; }

function applyTranslations() {
  document.documentElement.lang = currentLang;
  document.title = 'Booklet Maker — ' + (currentLang === 'cs' ? 'PDF sešit pro tisk' : 'PDF booklet for printing');

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if (typeof val === 'string') el.textContent = val;
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const key = el.getAttribute('data-i18n-html');
    const val = t(key);
    if (typeof val === 'string') el.innerHTML = val;
  });
  document.querySelectorAll('[data-i18n-svg]').forEach(el => {
    const key = el.getAttribute('data-i18n-svg');
    const val = t(key);
    if (typeof val === 'string') el.textContent = val;
  });

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.toLowerCase() === currentLang);
  });

  document.getElementById('print-tip-text').innerHTML = t('print_tip');

  if (numPages > 0) {
    const padded = Math.ceil(numPages / 4) * 4;
    document.getElementById('stat-pages-sub').textContent =
      padded > numPages ? t('padded_msg')(padded) : t('exact_msg');
    buildSheetsGrid(numPages, padded);
  }
  // Přepočítat popis výstupního formátu
  updateStats();
}

function setLang(lang) {
  currentLang = lang;
  applyTranslations();
}

let pdfBytes = null, resultBytes = null, fileName = '', numPages = 0;

function onDragOver(e) { e.preventDefault(); document.getElementById('drop-zone').classList.add('drag-over'); }
function onDragLeave(e) { document.getElementById('drop-zone').classList.remove('drag-over'); }
function onDrop(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
}

async function loadFile(file) {
  if (!file || file.type !== 'application/pdf') { showError(t('err_not_pdf')); return; }
  pdfBytes = await file.arrayBuffer();
  fileName = file.name;
  try {
    const doc = await PDFLib.PDFDocument.load(pdfBytes);
    const pages = doc.getPages();
    numPages = pages.length;
    const { width, height } = pages[0].getSize();
    // PDF body = 1/72 palce; detekuj imperiální prostředí dle jazyka prohlížeče
    const useImperial = navigator.language && navigator.language.startsWith('en-US');
    let sizeStr;
    if (useImperial) {
      const win = (width / 72).toFixed(2), hin = (height / 72).toFixed(2);
      sizeStr = `${win} × ${hin} in`;
    } else {
      const wmm = Math.round(width / 2.835), hmm = Math.round(height / 2.835);
      sizeStr = `${wmm} × ${hmm} mm`;
    }
    const padded = Math.ceil(numPages / 4) * 4;
    const fileSizeKB = Math.round(pdfBytes.byteLength / 1024);

    document.getElementById('fname').textContent = file.name;
    document.getElementById('fdetail').textContent = t('pages_detail')(numPages, fileSizeKB);
    document.getElementById('stat-pages').textContent = numPages;
    document.getElementById('stat-pages-sub').textContent = padded > numPages ? t('padded_msg')(padded) : t('exact_msg');
    document.getElementById('stat-size').textContent = sizeStr;
    document.getElementById('stat-sheets').textContent = padded / 4;

    buildSheetsGrid(numPages, padded);
    document.getElementById('drop-zone').style.display = 'none';
    document.getElementById('info-panel').style.display = 'block';
    document.getElementById('result-panel').style.display = 'none';
    document.getElementById('error-panel').style.display = 'none';
    document.getElementById('progress-panel').style.display = 'none';
  } catch(e) { showError(t('err_load')(e.message)); }
}

function updateStats() {
  if (!numPages) return;
  const padded = Math.ceil(numPages / 4) * 4;
  document.getElementById('stat-pages-sub').textContent = padded > numPages ? t('padded_msg')(padded) : t('exact_msg');
  document.getElementById('stat-sheets').textContent = padded / 4;
  const fmt = document.getElementById('format-select').value;
  const valMap  = { A4: 'A4', A3: 'A3', auto: 'Auto' };
  const subMap  = { A4: t('stat_output_sub_a4'), A3: t('stat_output_sub_a3'), auto: t('stat_output_sub_auto') };
  document.getElementById('stat-output-val').textContent = valMap[fmt] || 'A4';
  document.getElementById('stat-output-sub-el').textContent = subMap[fmt] || t('stat_output_sub_a4');
  buildSheetsGrid(numPages, padded);
}

function bookletOrder(total) {
  const sheets = [];
  const numSheets = total / 4;
  for (let i = 0; i < numSheets; i++) {
    const j = i * 2;
    sheets.push({
      front: [total - j,     j + 1],
      back:  [j + 2, total - j - 1]
    });
  }
  return sheets;
}

function buildSheetsGrid(n, padded) {
  const grid = document.getElementById('sheets-grid');
  grid.innerHTML = '';
  bookletOrder(padded).forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'sheet-item';
    const lbl = (p) => p > n ? `<span class="blank-page">${t('sheet_blank')}</span>` : `<strong>${p}</strong>`;
    el.innerHTML = `
      <div class="sheet-item-title">${t('sheet_lbl')} ${i + 1}</div>
      <div class="sheet-row"><span>${t('sheet_front')}</span><span>${lbl(s.front[0])} &nbsp; ${lbl(s.front[1])}</span></div>
      <div class="sheet-row"><span>${t('sheet_back')}</span><span>${lbl(s.back[0])} &nbsp; ${lbl(s.back[1])}</span></div>`;
    grid.appendChild(el);
  });
}

function setProgress(pct, label) {
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-label').textContent = label;
}

async function generate() {
  if (!pdfBytes) return;
  document.getElementById('gen-btn').disabled = true;
  document.getElementById('progress-panel').style.display = 'block';
  document.getElementById('result-panel').style.display = 'none';
  document.getElementById('error-panel').style.display = 'none';
  setProgress(5, t('prog_loading'));

  try {
    const srcDoc = await PDFLib.PDFDocument.load(pdfBytes);
    const srcPages = srcDoc.getPages();
    const n = srcPages.length;
    const padded = Math.ceil(n / 4) * 4;
    const fitScale = document.getElementById('fit-check').checked;
    // Okraj v bodech (1mm = 2.835 pt)
    const marginMM = parseFloat(document.getElementById('margin-select').value) || 0;
    const margin = marginMM * 2.835;

    // Výstupní formát — určuje velikost JEDNOHO slotu (= jedna stránka na archu)
    const fmt = document.getElementById('format-select').value;
    const PT_PER_MM = 2.835;
    let slotW, slotH;
    if (fmt === 'A4') {
      // Slot = A5 (148 × 210 mm)
      slotW = 148 * PT_PER_MM;
      slotH = 210 * PT_PER_MM;
    } else if (fmt === 'A3') {
      // Slot = A4 (210 × 297 mm)
      slotW = 210 * PT_PER_MM;
      slotH = 297 * PT_PER_MM;
    } else {
      // Auto — slot = rozměry první stránky PDF
      const { width: pw0, height: ph0 } = srcPages[0].getSize();
      slotW = pw0;
      slotH = ph0;
    }

    // Výstupní arch = 2 sloty vedle sebe (na šířku)
    const targetW = slotW;   // šířka jednoho slotu = polovina archu
    const targetH = slotH;   // výška archu
    const sheetW  = targetW * 2;
    const sheetH  = targetH;

    // Použitelná plocha po odečtení okrajů
    const usableW = targetW - 2 * margin;
    const usableH = targetH - 2 * margin;

    const outDoc = await PDFLib.PDFDocument.create();
    const sheets = bookletOrder(padded);
    const totalOps = sheets.length * 2;
    let done = 0;

    for (const sheet of sheets) {
      for (const pair of [sheet.front, sheet.back]) {
        const sheetPage = outDoc.addPage([sheetW, sheetH]);
        for (let side = 0; side < 2; side++) {
          const pageNum = pair[side];
          if (pageNum < 1 || pageNum > n) continue;
          const srcPage = srcPages[pageNum - 1];
          const [emb] = await outDoc.embedPages([srcPage]);
          // getSize() vrací cropbox — pro správné centrování použijeme
          // skutečné rozměry embedded objektu (mediabox)
          const pw = emb.width, ph = emb.height;
          let scale = fitScale ? Math.min(usableW / pw, usableH / ph) : 1;
          const sw = pw * scale, sh = ph * scale;
          // Centrovat v použitelném slotu s okrajem
          const ox = side * targetW + margin + (usableW - sw) / 2;
          const oy = margin + (usableH - sh) / 2;
          sheetPage.drawPage(emb, { x: ox, y: oy, width: sw, height: sh });
        }
        done++;
        setProgress(10 + Math.round((done / totalOps) * 85), `${t('prog_composing')} (${done} / ${totalOps})`);
        await new Promise(r => setTimeout(r, 0));
      }
    }

    setProgress(98, t('prog_saving'));
    resultBytes = await outDoc.save();
    const kb = Math.round(resultBytes.length / 1024);
    const outName = fileName.replace(/\.pdf$/i, '') + '-booklet.pdf';
    document.getElementById('result-name').textContent = outName;
    document.getElementById('result-detail').textContent = t('result_detail')(sheets.length, kb);
    document.getElementById('progress-panel').style.display = 'none';
    document.getElementById('result-panel').style.display = 'block';
    setProgress(100, '');
  } catch(e) {
    showError(t('err_process')(e.message));
    document.getElementById('progress-panel').style.display = 'none';
  }
  document.getElementById('gen-btn').disabled = false;
}

function downloadResult() {
  if (!resultBytes) return;
  const name = fileName.replace(/\.pdf$/i, '') + '-booklet.pdf';
  const blob = new Blob([resultBytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

function reset() {
  pdfBytes = null; resultBytes = null; fileName = ''; numPages = 0;
  document.getElementById('drop-zone').style.display = 'block';
  document.getElementById('info-panel').style.display = 'none';
  document.getElementById('result-panel').style.display = 'none';
  document.getElementById('error-panel').style.display = 'none';
  document.getElementById('progress-panel').style.display = 'none';
  document.getElementById('file-input').value = '';
}

function showError(msg) {
  const el = document.getElementById('error-panel');
  el.textContent = '⚠ ' + msg;
  el.style.display = 'block';
}

applyTranslations();
</script>
